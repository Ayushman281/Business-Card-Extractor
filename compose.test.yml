# Run on AWS only. This target contains no PyTorch or Qwen dependencies.
services:
  tests:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: tests
    environment:
      EXECUTION_TARGET: disabled
      ENABLE_MODEL_INFERENCE: "false"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=64m,uid=10001,gid=10001,mode=1770
