# AWS execution only. The .env defaults keep model loading disabled.
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    env_file: .env
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 12g
    stop_grace_period: 45s
    tmpfs:
      - /tmp:size=384m,uid=10001,gid=10001,mode=1770
    volumes:
      - model-cache:/opt/model-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; from app.core.config import Settings; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % Settings().backend_port, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-}
      API_PROXY_URL: ${API_PROXY_URL:-http://backend:8000}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  model-cache:
