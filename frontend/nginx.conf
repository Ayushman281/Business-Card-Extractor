limit_req_zone $binary_remote_addr zone=api_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 210m;
    client_body_timeout 60s;
    keepalive_timeout 30s;
    limit_conn connections 20;
    access_log off;
    # Request paths can contain result capabilities; avoid logging them.
    error_log /dev/stderr crit;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' ${API_BASE_URL}; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    location /api/ {
        limit_req zone=api_rate burst=20 nodelay;
        limit_req_status 429;
        proxy_pass ${API_PROXY_URL};
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location = /app-config.json {
        expires -1;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
